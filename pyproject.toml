[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"


[project]
name = "easyfermi"
authors = [
    { name = "Raniere de Menezes", email = "easyfermi@gmail.com" },
    { name = "Michele Peresano", email = "peresano.michele@gmail.com" },
]
description = "The easiest way to analyze Fermi-LAT data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
keywords = [
    "python",
    "fermi",
    "GUI",
    "graphical interface",
    "easyfermi",
    "gamma-rays",
]
license = { text = "BSD-3-Clause" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
]
dependencies = [
    "astropy==7.2.0",
    "astroquery==0.4.6",
    "corner==2.2.2",
    "emcee==3.1.4",
    "gammapy==2.1",
    "healpy==1.20.0",
    "matplotlib==3.11.2",
    "psutil==5.9.8",
    "PyQt5==5.15.9",
    "scipy==1.17.1",
]

dynamic = ["version"]


[tool.setuptools_scm]
write_to = "src/easyfermi/_version.py"


[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
"easyfermi.resources.ebl" = ["*.fits.gz"]
"easyfermi.resources.images" = ["*.png", "*.jpg"]


[project.optional-dependencies]
dev = ["easyfermi[docs]", "easyfermi[tests]", "ruff", "pre-commit"]


